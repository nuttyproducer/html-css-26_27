<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Contact opnemen</h1>

  <p>Heb je een vraag of opmerking? Vul het formulier in en we nemen zo snel mogelijk
     contact met je op.</p>

  <!-- Contactformulier: vier velden + submit en reset -->
  <form action="#" method="post">
    <div>
      <label for="naam">Naam</label>
      <input type="text" id="naam" name="naam" required>
    </div>
    <div>
      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="telefoon">Telefoonnummer</label>
      <input type="tel" id="telefoon" name="telefoon">
    </div>
    <div>
      <label for="bericht">Bericht</label>
      <textarea id="bericht" name="bericht" rows="5" required></textarea>
    </div>
    <button type="submit">Versturen</button>
    <button type="reset">Wissen</button>
  </form>

</body>
</html>

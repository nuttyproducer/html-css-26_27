<!--
  OEFENING 01.3 — Metadata & links
  Thema: Syntax  ·  Moeilijkheidsgraad: Gemiddeld

  OPDRACHT
  ---------
  Bouw een pagina over een hobby. Voeg in de head extra meta-tags toe (description,
  keywords, author) en een favicon-link. De inhoud over de hobby komt in de body.

  TIPS
  ----
  - Meta-tags en links horen in de head, zichtbare inhoud in de body.
-->
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn hobby: wandelen</title>
  <!-- Voeg hier je meta-tags (description, keywords, author) en je favicon-link toe -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Plaats hier je tekst over de hobby en je afbeelding (img) -->

</body>
</html>

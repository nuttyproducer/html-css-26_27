<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Restaurant Bij Ons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Restaurant Bij Ons</h1>
    <p>Vers en lokaal, elke dag opnieuw.</p>
  </header>

  <!-- Consistente navigatie, identiek op elke pagina -->
  <nav>
    <ul>
      <li><a href="oplossing.html">Home</a></li>
      <li><a href="over-ons.html">Over ons</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Contact</h2>
      <p>Reserveer een tafel of stel gerust een vraag.</p>
      <form action="#" method="post">
        <div>
          <label for="naam">Naam</label>
          <input type="text" id="naam" name="naam" required>
        </div>
        <div>
          <label for="email">E-mailadres</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="datum">Datum</label>
          <input type="date" id="datum" name="datum">
        </div>
        <div>
          <label for="bericht">Bericht</label>
          <textarea id="bericht" name="bericht" rows="4"></textarea>
        </div>
        <button type="submit">Versturen</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Restaurant Bij Ons</p>
  </footer>

</body>
</html>
